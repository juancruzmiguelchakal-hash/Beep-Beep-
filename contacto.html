<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | BeepBeep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#E31B23', dark: '#1A1A1A', light: '#F8F8F8' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    borderRadius: { 'xl': '24px' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-dark antialiased">
    <!-- Header Component -->
    <div id="header-placeholder"></div>

    <header class="pt-20 pb-12 text-center container mx-auto px-6">
        <h1 class="text-4xl md:text-5xl font-black mb-4 animate-fade-in-up">¿Necesitas <span
                class="text-primary">Ayuda?</span></h1>
        <p class="text-gray-500">Conéctate con BeepBeep.</p>
    </header>

    <section class="container mx-auto px-6 mb-20">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <!-- Form -->
            <div class="bg-white p-8 rounded-[32px] shadow-lg">
                <h3 class="text-2xl font-bold mb-6">Mensaje Directo</h3>
                <form action="https://formsubmit.co/info@beepbeep.com.ar" method="POST" class="space-y-6">
                    <!-- FormSubmit Configuration -->
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" value="https://beepbeep.example.com/thanks.html">
                    <input type="hidden" name="_template" value="table">

                    <div class="relative">
                        <input type="text" id="name" name="name" required
                            class="peer w-full bg-light border-b-2 border-grey p-4 pt-6 rounded-t-xl focus:outline-none focus:border-primary transition-all placeholder-transparent"
                            placeholder="Name">
                        <label for="name"
                            class="absolute left-4 top-4 text-gray-500 text-xs uppercase font-bold tracking-wide transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">Nombre</label>
                    </div>
                    <div class="relative">
                        <input type="email" id="email" name="email" required
                            class="peer w-full bg-light border-b-2 border-grey p-4 pt-6 rounded-t-xl focus:outline-none focus:border-primary transition-all placeholder-transparent"
                            placeholder="Email">
                        <label for="email"
                            class="absolute left-4 top-4 text-gray-500 text-xs uppercase font-bold tracking-wide transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">Email</label>
                    </div>
                    <div class="relative">
                        <textarea id="message" name="message" rows="4" required
                            class="peer w-full bg-light border-b-2 border-grey p-4 pt-6 rounded-t-xl focus:outline-none focus:border-primary transition-all placeholder-transparent"
                            placeholder="Message"></textarea>
                        <label for="message"
                            class="absolute left-4 top-4 text-gray-500 text-xs uppercase font-bold tracking-wide transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">Mensaje</label>
                    </div>

                    <!-- Math Captcha -->
                    <div class="relative">
                        <div class="flex items-center gap-4">
                            <span id="captcha-question" class="text-lg font-bold text-gray-600 select-none"></span>
                            <div class="relative flex-1">
                                <input type="number" id="captcha-answer" required
                                    class="peer w-full bg-light border-b-2 border-grey p-4 pt-6 rounded-t-xl focus:outline-none focus:border-primary transition-all placeholder-transparent"
                                    placeholder="Resultado">
                                <label for="captcha-answer"
                                    class="absolute left-4 top-4 text-gray-500 text-xs uppercase font-bold tracking-wide transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">Resultado</label>
                            </div>
                        </div>
                        <p id="captcha-error" class="text-primary text-xs font-bold mt-1 hidden">¡Resultado incorrecto!
                            Intenta de nuevo.</p>
                    </div>

                    <button type="submit"
                        class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg hover:bg-red-600 hover:shadow-xl transition-all hover:-translate-y-1">
                        Enviar Mensaje
                    </button>
                </form>

                <script>
                    document.addEventListener('DOMContentLoaded', () => {
                        const form = document.querySelector('form[action^="https://formsubmit.co"]');
                        const questionEl = document.getElementById('captcha-question');
                        const answerEl = document.getElementById('captcha-answer');
                        const errorEl = document.getElementById('captcha-error');

                        let num1, num2, correctAnswer;

                        function generateCaptcha() {
                            const isAddition = Math.random() > 0.5;
                            let n1 = Math.floor(Math.random() * 10) + 1;
                            let n2 = Math.floor(Math.random() * 10) + 1;

                            if (isAddition) {
                                correctAnswer = n1 + n2;
                                questionEl.textContent = `${n1} + ${n2} = ?`;
                            } else {
                                // Ensure non-negative result for simplicity
                                if (n1 < n2) [n1, n2] = [n2, n1];
                                correctAnswer = n1 - n2;
                                questionEl.textContent = `${n1} - ${n2} = ?`;
                            }

                            answerEl.value = '';
                            errorEl.classList.add('hidden');
                        }

                        // Init
                        generateCaptcha();

                        form.addEventListener('submit', (e) => {
                            const userAnswer = parseInt(answerEl.value, 10);

                            if (userAnswer !== correctAnswer) {
                                e.preventDefault();
                                errorEl.classList.remove('hidden');
                                // Shake effect
                                answerEl.classList.add('animate-pulse', 'border-primary');
                                setTimeout(() => {
                                    answerEl.classList.remove('animate-pulse', 'border-primary');
                                }, 500);
                                return false;
                            }
                            // Allow submission
                        });
                    });
                </script>
            </div>

            <!-- Quick Links & Map -->
            <div class="space-y-8">
                <!-- Stacked Buttons -->
                <a href="https://wa.me/541157280600?text=Hola%20BeepBeep,%20quiero%20consultar%20sobre%20un%20servicio"
                    target="_blank"
                    class="flex items-center gap-4 bg-white p-6 rounded-2xl shadow-sm hover:shadow-lg transition-all hover:scale-[1.02] cursor-pointer group border border-transparent hover:border-green-500">
                    <div
                        class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center text-green-500 group-hover:bg-green-500 group-hover:text-white transition-colors">
                        <i class="fa-brands fa-whatsapp text-2xl"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-lg">WhatsApp</h4>
                        <p class="text-sm text-gray-500">+54 11 5728 0600</p>
                    </div>
                    <i class="fa-solid fa-chevron-right ml-auto text-gray-300"></i>
                </a>

                <a href="https://www.instagram.com/beepbeep_ok/" target="_blank"
                    class="flex items-center gap-4 bg-white p-6 rounded-2xl shadow-sm hover:shadow-lg transition-all hover:scale-[1.02] cursor-pointer group border border-transparent hover:border-pink-500">
                    <div
                        class="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center text-pink-500 group-hover:bg-pink-500 group-hover:text-white transition-colors">
                        <i class="fa-brands fa-instagram text-2xl"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-lg">Instagram</h4>
                        <p class="text-sm text-gray-500">Síguenos @beepbeep_ok</p>
                    </div>
                    <i class="fa-solid fa-chevron-right ml-auto text-gray-300"></i>
                </a>

                <!-- Map -->
                <div class="h-64 rounded-[32px] overflow-hidden relative shadow-inner bg-gray-200 group">
                    <div
                        class="absolute inset-0 bg-[url('https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg')] bg-cover bg-center opacity-30 invert grayscale transition-transform duration-700 group-hover:scale-110">
                    </div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-32 h-32 bg-primary/20 rounded-full animate-ping absolute"></div>
                        <div class="w-4 h-4 bg-primary rounded-full relative z-10 shadow-[0_0_20px_#E31B23]"></div>
                        <div class="absolute mt-12 bg-dark text-white text-xs font-bold px-3 py-1 rounded-full">Zona:
                            San Vicente</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Component -->
    <div id="footer-placeholder"></div>

    <script src="loadComponents.js"></script>
    <script src="main.js"></script>
</body>

</html>
