<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Michizen - Menú | BeepBeep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#E31B23', dark: '#1A1A1A', light: '#F8F8F8', grey: '#E0E0E0' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    borderRadius: { 'xl': '24px' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-dark antialiased">
    <!-- Header Component -->
    <div id="header-placeholder"></div>

    <!-- Restaurant Hero -->

    <!-- Restaurant Hero -->
    <header class="relative h-[50vh] min-h-[400px]">
        <div
            class="absolute inset-0 bg-[url('../assets/images/comercios/El Michizen/el-michizen.jpg')] bg-cover bg-center">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent"></div>
        <div class="absolute bottom-0 left-0 w-full p-8 md:p-12">
            <div class="container mx-auto flex flex-col md:flex-row items-end justify-between gap-6">
                <div>
                    <span
                        class="bg-primary text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block">Sushi</span>
                    <h1 class="text-4xl md:text-6xl font-black text-white mb-2">El Michizen</h1>
                    <div class="flex items-center gap-4 text-white/90 text-sm font-medium">
                        <span><i class="fa-solid fa-star text-yellow-400"></i> Nuevo</span>
                        <span>•</span>
                        <span><i class="fa-solid fa-clock"></i> Próximamente</span>
                        <span>•</span>
                        <span><i class="fa-solid fa-motorcycle"></i> Consultar envío</span>
                    </div>
                </div>
                <!-- Unified Download Button -->
                <div class="relative">
                    <button id="menu-download-btn"
                        class="bg-primary hover:bg-red-600 text-white font-bold py-4 px-8 rounded-xl shadow-[0_0_20px_rgba(227,27,35,0.4)] hover:shadow-[0_0_30px_rgba(227,27,35,0.6)] hover:scale-105 transition-all text-lg flex items-center gap-3">
                        Pedí YA <i class="fa-solid fa-mobile-screen-button"></i>
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="menu-download-dropdown"
                        class="hidden absolute top-full right-0 mt-2 w-64 bg-white rounded-xl shadow-2xl border border-gray-100 overflow-hidden z-50 animate-fade-in-up">
                        <div class="p-2">
                            <a href="https://apps.apple.com/ar/app/beepbeep-delivery-online/id6752507939"
                                target="_blank"
                                class="flex items-center gap-3 p-4 rounded-lg hover:bg-gray-50 transition-colors group">
                                <i
                                    class="fa-brands fa-apple text-2xl text-gray-700 group-hover:text-primary transition-colors"></i>
                                <div class="flex-1">
                                    <p class="text-sm font-bold text-dark">Descargar para iPhone</p>
                                    <p class="text-xs text-gray-500">App Store</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
                            </a>
                            <a href="https://play.google.com/store/apps/details?id=com.beepbeepdeliverygroup.app"
                                target="_blank"
                                class="flex items-center gap-3 p-4 rounded-lg hover:bg-gray-50 transition-colors group">
                                <i
                                    class="fa-brands fa-google-play text-2xl text-gray-700 group-hover:text-primary transition-colors"></i>
                                <div class="flex-1">
                                    <p class="text-sm font-bold text-dark">Descargar para Android</p>
                                    <p class="text-xs text-gray-500">Play Store</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Menu Section -->
    <section class="container mx-auto px-6 py-12">
        <div class="text-center py-20 bg-white rounded-xl shadow-lg">
            <i class="fa-solid fa-fish-fins text-6xl text-primary mb-6"></i>
            <h2 class="text-3xl font-bold mb-4">Preparando los rolls</h2>
            <p class="text-gray-500 max-w-md mx-auto">El mejor sushi de la zona está por llegar a BeepBeep. ¡Muy pronto
                disponible en la app!</p>
        </div>
    </section>

    <!-- Footer Component -->
    <div id="footer-placeholder"></div>
    <script src="../loadComponents.js"></script>
    <script src="../main.js"></script>
</body>

</html>
