<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercios | BeepBeep</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#E31B23', dark: '#1A1A1A', light: '#F8F8F8', grey: '#E0E0E0' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    borderRadius: { 'xl': '24px' }
                }
            }
        }
    </script>
</head>

<body class="bg-light font-sans text-dark antialiased">
    <!-- Header Component -->
    <div id="header-placeholder"></div>

    <!-- Header -->
    <header class="pt-20 pb-12 bg-white text-center px-4">
        <h1 class="text-3xl md:text-5xl font-black mb-4 animate-fade-in-up">Descubre los Mejores <span
                class="text-primary">Comercios</span></h1>
        <p class="text-gray-500 max-w-xl mx-auto text-lg">De San Vicente a tu mesa.</p>
    </header>

    <!-- Filters -->
    <section id="filters-section" class="container mx-auto px-6 mb-12 py-4">
        <div class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide justify-start md:justify-center">
            <button
                class="filter-btn bg-primary text-white px-6 py-2 rounded-full font-bold shadow-lg shadow-primary/30 whitespace-nowrap transition-all hover:scale-105 flex items-center gap-2"
                data-filter="all">
                Todos
            </button>
            <button
                class="filter-btn bg-white text-dark px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap hover:text-primary transition-all hover:scale-105 flex items-center gap-2"
                data-filter="best-rated">
                <i class="fa-solid fa-star"></i> Mejor Calificado
            </button>
            <button
                class="filter-btn bg-white text-dark px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap hover:text-primary transition-all hover:scale-105 flex items-center gap-2"
                data-filter="open">
                <i class="fa-solid fa-door-open"></i> Abierto Ahora
            </button>
            <button
                class="filter-btn bg-white text-dark px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap hover:text-primary transition-all hover:scale-105 flex items-center gap-2"
                data-filter="promo">
                <i class="fa-solid fa-tag"></i> Con Promociones
            </button>
        </div>
    </section>

    <!-- Grid -->
    <section class="container mx-auto px-6 mb-20">
        <div id="restaurantGrid"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 transition-opacity duration-300">
            <!-- Content Injected by main.js -->
            <!-- Placeholder while JS loads -->
            <div class="col-span-full text-center py-20 text-gray-400">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i>
                <p>Cargando sabores...</p>
            </div>
        </div>
    </section>

    <!-- Footer Component -->
    <div id="footer-placeholder"></div>

    <script src="loadComponents.js"></script>
    <script src="main.js"></script>
</body>

</html>
